services:
  user-service:
    container_name: 'number-platform_user-service'
    build:
      context: .
      dockerfile: services/user-service/.Dockerfile
    ports:
      - '${USER_SERVICE_PORT:-8080}:${USER_SERVICE_HOST_PORT:-8080}'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: 'postgres:15-alpine'
    container_name: 'number-platform_postgres'
    env_file:
      - .env
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: 'number-platform_liquibase'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog/db.changelog-master.xml
      LIQUIBASE_COMMAND_DRIVER: org.postgresql.Driver
    volumes:
      - ./infra/db/migration:/liquibase/changelog
    command: update

volumes:
  postgres_data: