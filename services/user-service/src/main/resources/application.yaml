spring:
  application:
    name: auth_service
  liquibase:
    enabled: false                    # Отдельно запускаемый контейнер
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:db}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AuthServicePool
      maximum-pool-size: 20
      minimum-idle: 5                 # Минимальное количество простаивающих соединений
      connection-timeout: 30000       # Максимальное время ожидания соединения из пула (30 сек.)
      idle-timeout: 600000            # Время, через которое простаивающее соединение может быть закрыто (10 мин.)
      max-lifetime: 1800000           # Максимальное время жизни соединения в пуле (30 мин.)
      validation-timeout: 5000        # Тайм-аут проверки валидности соединения (5 сек.)
  jpa:
    open-in-view: false
    show-sql: false
    generate-ddl: false               # Т.к. используется liquibase
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format-sql: true              # Форматирование SQL-запросов в логах
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        generate_statistics: false
        query:
          in_clause_parameter_padding: true

app:
  jwt:
    secretKey: ${JWT_SECRET}
    validity: 1h
