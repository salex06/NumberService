spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service-auth
              uri: http://user-service:${USER_SERVICE_PORT:-8080}
              predicates:
                - Path=/api/auth/**

            - id: user-service-api-docs
              uri: http://user-service:${USER_SERVICE_PORT:-8080}
              predicates:
                - Path=/user-service/v3/api-docs/**
              filters:
                - StripPrefix=1

            - id: number-service-api
              uri: http://number-service:${NUMBER_SERVICE_PORT:-8080}
              predicates:
                - Path=/api/numbers,/api/numbers/**

            - id: number-service-api-docs
              uri: http://number-service:${NUMBER_SERVICE_PORT:-8080}
              predicates:
                - Path=/number-service/v3/api-docs/**
              filters:
                - StripPrefix=1



app:
  jwt:
    secret-key: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /user-service/v3/api-docs

      - name: number-service
        url: /number-service/v3/api-docs